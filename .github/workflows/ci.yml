name: verify-paper

# Enforces the manuscript reproducibility harness in CI. The verifier recomputes
# every headline claim in paper/main_v2.tex from committed data and exits
# non-zero on any mismatch, so a red check here means a claim no longer
# reproduces.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all headline claims reproduce
        run: python verify.py
